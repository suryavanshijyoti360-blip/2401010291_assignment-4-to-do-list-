<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced To-Do List</title>
  <style>
    body { font-family: Arial; background:#0f172a; color:white; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .box { background:#1e293b; padding:20px; border-radius:12px; width:320px; text-align:center; }
    input { width:100%; padding:10px; margin:8px 0; border:none; border-radius:6px; }
    button { padding:8px; border:none; background:#38bdf8; border-radius:8px; cursor:pointer; margin:2px; }
    .task { background:#334155; padding:10px; margin-top:10px; border-radius:8px; display:flex; flex-direction:column; }
    .completed { text-decoration: line-through; opacity:0.6; }
    .task-actions { margin-top:5px; }
  </style>
</head>
<body><div class="box">
  <h2>To-Do List ✅</h2>
  <input id="taskInput" placeholder="Enter task">
  <button onclick="addTask()">Add</button>
  <div id="taskList"></div>
</div><script>
let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

function saveTasks(){
  localStorage.setItem('tasks', JSON.stringify(tasks));
}

function displayTasks(){
  let list = document.getElementById('taskList');
  list.innerHTML = '';

  tasks.forEach((task, index)=>{
    let div = document.createElement('div');
    div.className = 'task';

    let text = document.createElement('span');
    text.innerText = task.text + " (" + task.time + ")";
    if(task.completed) text.classList.add('completed');

    let actions = document.createElement('div');
    actions.className = 'task-actions';

    let completeBtn = document.createElement('button');
    completeBtn.innerText = '✔';
    completeBtn.onclick = ()=>toggleComplete(index);

    let editBtn = document.createElement('button');
    editBtn.innerText = '✏️';
    editBtn.onclick = ()=>editTask(index);

    let deleteBtn = document.createElement('button');
    deleteBtn.innerText = 'X';
    deleteBtn.onclick = ()=>deleteTask(index);

    actions.appendChild(completeBtn);
    actions.appendChild(editBtn);
    actions.appendChild(deleteBtn);

    div.appendChild(text);
    div.appendChild(actions);

    list.appendChild(div);
  });
}

function addTask(){
  let input = document.getElementById('taskInput');
  let text = input.value;
  if(!text) return;

  let time = new Date().toLocaleString();

  tasks.push({ text, completed:false, time });
  saveTasks();
  displayTasks();

  input.value='';
}

function toggleComplete(index){
  tasks[index].completed = !tasks[index].completed;
  saveTasks();
  displayTasks();
}

function deleteTask(index){
  tasks.splice(index,1);
  saveTasks();
  displayTasks();
}

function editTask(index){
  let newText = prompt('Edit task', tasks[index].text);
  if(newText){
    tasks[index].text = newText;
    saveTasks();
    displayTasks();
  }
}

displayTasks();
</script></body>
</html>
